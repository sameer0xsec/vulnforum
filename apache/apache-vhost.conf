ServerTokens Full

<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        # VULN: directory listing enabled app-wide, and .htaccess overrides
        # allowed (meaning a misplaced/missing .htaccess leaves no protection
        # at all for e.g. /uploads or /includes).
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # VULN: mod_status exposed to anyone.
    <Location "/server-status">
        SetHandler server-status
        Require all granted
    </Location>

    ServerSignature On
    TraceEnable On
</VirtualHost>

